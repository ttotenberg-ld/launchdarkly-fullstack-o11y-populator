services:
  # Postgres - shared database server with one logical DB per stateful service.
  # Ephemeral: no volume mount, so `docker compose up` re-runs init SQL every
  # time and every team member gets deterministic, identical starting state.
  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-app}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-app}
      - POSTGRES_DB=appmeta
    # Bind to loopback only — services reach postgres via the internal Docker
    # network, and local tools (psql, DBeaver) reach it via an SSH tunnel:
    #   ssh -L 5432:localhost:5432 <ec2-host>
    # Never bind to 0.0.0.0 here: it would publish the DB to the internet.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ./postgres/initdb:/docker-entrypoint-initdb.d:ro
    networks:
      - ld-observability
    restart: unless-stopped
    healthcheck:
      # -d appmeta: pg_isready defaults the DB name to the username ("app"),
      # which doesn't exist here (we have appmeta + per-service DBs). Without
      # -d this spams `FATAL: database "app" does not exist` every interval.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d appmeta"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s

  # API Gateway - Entry point for all requests
  api-gateway:
    build:
      context: ./backend
      dockerfile: services/api-gateway/Dockerfile
    ports:
      - "5050:5000"
    environment:
      - LD_SDK_KEY=${LD_SDK_KEY}
      - SERVICE_NAME=api-gateway
      - SERVICE_VERSION=${SERVICE_VERSION:-2.0.3}
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - FLASK_PORT=5000
      - USE_DOCKER=true
    depends_on:
      - auth-service
      - user-service
      - order-service
      - search-service
      - inventory-service
      - chat-service
    networks:
      - ld-observability
    restart: unless-stopped

  # Auth Service
  auth-service:
    build:
      context: ./backend
      dockerfile: services/auth-service/Dockerfile
    ports:
      - "5001:5001"
    environment:
      - LD_SDK_KEY=${LD_SDK_KEY}
      - SERVICE_NAME=auth-service
      - SERVICE_VERSION=${SERVICE_VERSION:-2.0.2}
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - FLASK_PORT=5001
      - USE_DOCKER=true
    depends_on:
      - analytics-service
    networks:
      - ld-observability
    restart: unless-stopped

  # User Service
  user-service:
    build:
      context: ./backend
      dockerfile: services/user-service/Dockerfile
    ports:
      - "5002:5002"
    environment:
      - LD_SDK_KEY=${LD_SDK_KEY}
      - SERVICE_NAME=user-service
      - SERVICE_VERSION=${SERVICE_VERSION:-2.0.2}
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - FLASK_PORT=5002
      - USE_DOCKER=true
      - POSTGRES_HOST=${POSTGRES_HOST:-postgres}
      - POSTGRES_USER=${POSTGRES_USER:-app}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-app}
      - DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@postgres:5432/userdb
    depends_on:
      analytics-service:
        condition: service_started
      notification-service:
        condition: service_started
      postgres:
        condition: service_healthy
    networks:
      - ld-observability
    restart: unless-stopped

  # Order Service
  order-service:
    build:
      context: ./backend
      dockerfile: services/order-service/Dockerfile
    ports:
      - "5003:5003"
    environment:
      - LD_SDK_KEY=${LD_SDK_KEY}
      - SERVICE_NAME=order-service
      - SERVICE_VERSION=${SERVICE_VERSION:-2.0.2}
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - FLASK_PORT=5003
      - USE_DOCKER=true
      - POSTGRES_HOST=${POSTGRES_HOST:-postgres}
      - POSTGRES_USER=${POSTGRES_USER:-app}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-app}
      - DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@postgres:5432/orderdb
    depends_on:
      payment-service:
        condition: service_started
      inventory-service:
        condition: service_started
      notification-service:
        condition: service_started
      postgres:
        condition: service_healthy
    networks:
      - ld-observability
    restart: unless-stopped

  # Payment Service
  payment-service:
    build:
      context: ./backend
      dockerfile: services/payment-service/Dockerfile
    ports:
      - "5004:5004"
    environment:
      - LD_SDK_KEY=${LD_SDK_KEY}
      - SERVICE_NAME=payment-service
      - SERVICE_VERSION=${SERVICE_VERSION:-2.0.2}
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - FLASK_PORT=5004
      - USE_DOCKER=true
      - POSTGRES_HOST=${POSTGRES_HOST:-postgres}
      - POSTGRES_USER=${POSTGRES_USER:-app}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-app}
      - DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@postgres:5432/paymentdb
      # Pool deliberately exposed as overrides so payment-processor-migration
      # v2 can demo connection-pool exhaustion by shrinking pool size.
      - DB_POOL_SIZE=${PAYMENT_DB_POOL_SIZE:-5}
      - DB_MAX_OVERFLOW=${PAYMENT_DB_MAX_OVERFLOW:-10}
    depends_on:
      notification-service:
        condition: service_started
      postgres:
        condition: service_healthy
    networks:
      - ld-observability
    restart: unless-stopped

  # Inventory Service
  inventory-service:
    build:
      context: ./backend
      dockerfile: services/inventory-service/Dockerfile
    ports:
      - "5005:5005"
    environment:
      - LD_SDK_KEY=${LD_SDK_KEY}
      - SERVICE_NAME=inventory-service
      - SERVICE_VERSION=${SERVICE_VERSION:-2.0.2}
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - FLASK_PORT=5005
      - USE_DOCKER=true
      - POSTGRES_HOST=${POSTGRES_HOST:-postgres}
      - POSTGRES_USER=${POSTGRES_USER:-app}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-app}
      - DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@postgres:5432/inventorydb
    depends_on:
      notification-service:
        condition: service_started
      postgres:
        condition: service_healthy
    networks:
      - ld-observability
    restart: unless-stopped

  # Notification Service (leaf service - no dependencies)
  notification-service:
    build:
      context: ./backend
      dockerfile: services/notification-service/Dockerfile
    ports:
      - "5006:5006"
    environment:
      - LD_SDK_KEY=${LD_SDK_KEY}
      - SERVICE_NAME=notification-service
      - SERVICE_VERSION=${SERVICE_VERSION:-2.0.2}
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - FLASK_PORT=5006
      - USE_DOCKER=true
    networks:
      - ld-observability
    restart: unless-stopped

  # Analytics Service — also hosts the retention reaper background job
  # (sweeps old rows, restocks inventory, once every 5 min).
  analytics-service:
    build:
      context: ./backend
      dockerfile: services/analytics-service/Dockerfile
    ports:
      - "5007:5007"
    environment:
      - LD_SDK_KEY=${LD_SDK_KEY}
      - SERVICE_NAME=analytics-service
      - SERVICE_VERSION=${SERVICE_VERSION:-2.0.2}
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - FLASK_PORT=5007
      - USE_DOCKER=true
      - POSTGRES_HOST=${POSTGRES_HOST:-postgres}
      - POSTGRES_USER=${POSTGRES_USER:-app}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-app}
      # Reaper opens engines per-DB dynamically; this default is just a fallback.
      - DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@postgres:5432/paymentdb
      # Retention tuning — 7 days for audit tables, 2 hours for short-lived reservations.
      - RETENTION_SECONDS=${RETENTION_SECONDS:-604800}
      - RETENTION_SECONDS_RESERVATIONS=${RETENTION_SECONDS_RESERVATIONS:-7200}
      - RETENTION_SWEEP_INTERVAL_MINUTES=${RETENTION_SWEEP_INTERVAL_MINUTES:-5}
      - RETENTION_ENABLED=${RETENTION_ENABLED:-true}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ld-observability
    restart: unless-stopped

  # Search Service
  search-service:
    build:
      context: ./backend
      dockerfile: services/search-service/Dockerfile
    ports:
      - "5008:5008"
    environment:
      - LD_SDK_KEY=${LD_SDK_KEY}
      - SERVICE_NAME=search-service
      - SERVICE_VERSION=${SERVICE_VERSION:-2.0.2}
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - FLASK_PORT=5008
      - USE_DOCKER=true
      # search-service reads from the shared inventorydb (cross-service DB read
      # pattern — worth showing in traces).
      - POSTGRES_HOST=${POSTGRES_HOST:-postgres}
      - POSTGRES_USER=${POSTGRES_USER:-app}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-app}
      - DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@postgres:5432/inventorydb
    depends_on:
      inventory-service:
        condition: service_started
      postgres:
        condition: service_healthy
    networks:
      - ld-observability
    restart: unless-stopped

  # Chat Service (AI support chatbot via Ollama + LD AI Configs)
  chat-service:
    build:
      context: ./backend
      dockerfile: services/chat-service/Dockerfile
    ports:
      - "5009:5009"
    environment:
      - LD_SDK_KEY=${LD_SDK_KEY}
      - SERVICE_NAME=chat-service
      - SERVICE_VERSION=${SERVICE_VERSION:-2.0.2}
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - FLASK_PORT=5009
      - USE_DOCKER=true
      - OLLAMA_URL=${OLLAMA_URL:-http://ollama:11434}
      - CHAT_ENABLED=${CHAT_ENABLED:-true}
      - POSTGRES_HOST=${POSTGRES_HOST:-postgres}
      - POSTGRES_USER=${POSTGRES_USER:-app}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-app}
      - DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@postgres:5432/chatdb
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ld-observability
    restart: unless-stopped

  # Ollama - Local LLM server (only with --profile local-models)
  # For team deployments, set OLLAMA_URL in .env to point at a shared central server instead
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=-1
    networks:
      - ld-observability
    restart: unless-stopped
    profiles:
      - local-models
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # One-shot init container: pull models + warm them up so first requests are fast
  ollama-pull:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Pulling gemma3:1b..."
        OLLAMA_HOST=http://ollama:11434 ollama pull gemma3:1b
        echo "Pulling deepseek-r1:1.5b..."
        OLLAMA_HOST=http://ollama:11434 ollama pull deepseek-r1:1.5b
        echo "All models pulled. Warming up..."
        OLLAMA_HOST=http://ollama:11434 ollama run gemma3:1b "hi" --nowordwrap
        echo "gemma3:1b warm."
        OLLAMA_HOST=http://ollama:11434 ollama run deepseek-r1:1.5b "hi" --nowordwrap
        echo "deepseek-r1:1.5b warm."
        echo "All models ready."
    networks:
      - ld-observability
    profiles:
      - local-models

  # Frontend
  frontend:
    build:
      context: ./frontend
      args:
        - VITE_LD_CLIENT_SIDE_ID=${VITE_LD_CLIENT_SIDE_ID}
        # Use empty string so frontend uses relative URLs (/api/...) which nginx proxies
        - VITE_API_URL=
        # Baked into the JS bundle at npm run build — requires --build when bumped.
        - VITE_SERVICE_VERSION=${SERVICE_VERSION:-2.0.2}
    ports:
      - "3000:80"
    depends_on:
      - api-gateway
    networks:
      - ld-observability
    restart: unless-stopped

  # Traffic Simulator (Browser-based with Playwright)
  # Human-like sessions: ~60 seconds each, with typing, hesitation, and full endpoint coverage
  simulator:
    build:
      context: .
      dockerfile: simulator/Dockerfile
    environment:
      - FRONTEND_URL=http://frontend:80
      - SESSIONS_PER_MINUTE=${SESSIONS_PER_MINUTE:-2}
      - MAX_CONCURRENT_BROWSERS=${MAX_CONCURRENT_BROWSERS:-3}
      - TARGET_SESSION_DURATION=${TARGET_SESSION_DURATION:-60}
      - SESSION_TIMEOUT=${SESSION_TIMEOUT:-90}
      - WEDGE_NO_SUCCESS_SECONDS=${WEDGE_NO_SUCCESS_SECONDS:-300}
    volumes:
      - ./simulator/logs:/app/logs
    depends_on:
      - frontend
      - api-gateway
    networks:
      - ld-observability
    restart: unless-stopped
    # Heartbeat file is touched on every successful session by the python
    # supervisor; if it goes stale, the wedge detector inside python will
    # sys.exit(1) and restart: unless-stopped brings us back. This check
    # primarily exists so `docker ps` surfaces the unhealthy state before
    # the python-side wedge detector fires — visibility, not enforcement.
    # HOSTNAME differs per replica so simulator-1/-2/-3 each see their own
    # heartbeat on the shared ./simulator/logs bind mount.
    healthcheck:
      test: ["CMD-SHELL", "test -f /app/logs/.heartbeat-$$HOSTNAME && find /app/logs/.heartbeat-$$HOSTNAME -mmin -3 | grep -q ."]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 180s
    # Playwright needs more resources. 2 engines × up to 3 concurrent contexts
    # blows past 2G during peak; 4G gives headroom + room for the periodic
    # recycle to overlap old+new engine processes briefly without OOM.
    deploy:
      resources:
        limits:
          memory: 4G

  # OOM watcher — tails the host kernel ring buffer (dmesg) for cgroup
  # OOM-kill events, resolves the offending cgroup back to a docker
  # container name, and ships a structured log to LaunchDarkly via the
  # existing ObservabilityPlugin. Why: docker inspect's OOMKilled flag
  # only flips when PID 1 is the kill target; renderer-subprocess kills
  # (chrome-headless, WPEWebProcess inside the simulator) leave the
  # container "Up" while it silently wedges. This sidecar surfaces those.
  oom-watcher:
    build:
      context: .
      dockerfile: oom-watcher/Dockerfile
    environment:
      - LD_SDK_KEY=${LD_SDK_KEY}
      - SERVICE_NAME=oom-watcher
      - SERVICE_VERSION=${SERVICE_VERSION:-2.0.2}
      - ENVIRONMENT=${ENVIRONMENT:-development}
    # pid:host so dmesg can read the host kernel ring buffer (not the
    # container's namespaced view, which is empty).
    pid: host
    # SYS_ADMIN is sufficient on most kernels for unprivileged dmesg; if
    # your host has kernel.dmesg_restrict=1 (common on hardened AMIs),
    # bump to `privileged: true` instead.
    cap_add:
      - SYS_ADMIN
    volumes:
      # Read-only docker.sock so we can resolve cgroup IDs → container names.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    # /dev/kmsg must be exposed as a device, not just relying on pid:host —
    # without it dmesg falls back to klogctl(SYSLOG_ACTION_READ), which has
    # different follow semantics (drain-and-exit, not tail-forever). The
    # device mount is the minimum-privilege way to give dmesg a working
    # /dev/kmsg without going full `privileged: true`.
    devices:
      - /dev/kmsg:/dev/kmsg
    networks:
      - ld-observability
    restart: unless-stopped

volumes:
  ollama_data:

networks:
  ld-observability:
    driver: bridge
