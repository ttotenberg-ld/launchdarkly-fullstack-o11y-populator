services:
  # API Gateway - Entry point for all requests
  api-gateway:
    build:
      context: ./backend
      dockerfile: services/api-gateway/Dockerfile
    ports:
      - "5050:5000"
    environment:
      - LD_SDK_KEY=${LD_SDK_KEY}
      - SERVICE_NAME=api-gateway
      - SERVICE_VERSION=1.0.0
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - FLASK_PORT=5000
      - USE_DOCKER=true
    depends_on:
      - auth-service
      - user-service
      - order-service
      - search-service
      - inventory-service
      - chat-service
    networks:
      - ld-observability
    restart: unless-stopped

  # Auth Service
  auth-service:
    build:
      context: ./backend
      dockerfile: services/auth-service/Dockerfile
    ports:
      - "5001:5001"
    environment:
      - LD_SDK_KEY=${LD_SDK_KEY}
      - SERVICE_NAME=auth-service
      - SERVICE_VERSION=1.0.0
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - FLASK_PORT=5001
      - USE_DOCKER=true
    depends_on:
      - analytics-service
    networks:
      - ld-observability
    restart: unless-stopped

  # User Service
  user-service:
    build:
      context: ./backend
      dockerfile: services/user-service/Dockerfile
    ports:
      - "5002:5002"
    environment:
      - LD_SDK_KEY=${LD_SDK_KEY}
      - SERVICE_NAME=user-service
      - SERVICE_VERSION=1.0.0
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - FLASK_PORT=5002
      - USE_DOCKER=true
    depends_on:
      - analytics-service
      - notification-service
    networks:
      - ld-observability
    restart: unless-stopped

  # Order Service
  order-service:
    build:
      context: ./backend
      dockerfile: services/order-service/Dockerfile
    ports:
      - "5003:5003"
    environment:
      - LD_SDK_KEY=${LD_SDK_KEY}
      - SERVICE_NAME=order-service
      - SERVICE_VERSION=1.0.0
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - FLASK_PORT=5003
      - USE_DOCKER=true
    depends_on:
      - payment-service
      - inventory-service
      - notification-service
    networks:
      - ld-observability
    restart: unless-stopped

  # Payment Service
  payment-service:
    build:
      context: ./backend
      dockerfile: services/payment-service/Dockerfile
    ports:
      - "5004:5004"
    environment:
      - LD_SDK_KEY=${LD_SDK_KEY}
      - SERVICE_NAME=payment-service
      - SERVICE_VERSION=1.0.0
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - FLASK_PORT=5004
      - USE_DOCKER=true
    depends_on:
      - notification-service
    networks:
      - ld-observability
    restart: unless-stopped

  # Inventory Service
  inventory-service:
    build:
      context: ./backend
      dockerfile: services/inventory-service/Dockerfile
    ports:
      - "5005:5005"
    environment:
      - LD_SDK_KEY=${LD_SDK_KEY}
      - SERVICE_NAME=inventory-service
      - SERVICE_VERSION=1.0.0
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - FLASK_PORT=5005
      - USE_DOCKER=true
    depends_on:
      - notification-service
    networks:
      - ld-observability
    restart: unless-stopped

  # Notification Service (leaf service - no dependencies)
  notification-service:
    build:
      context: ./backend
      dockerfile: services/notification-service/Dockerfile
    ports:
      - "5006:5006"
    environment:
      - LD_SDK_KEY=${LD_SDK_KEY}
      - SERVICE_NAME=notification-service
      - SERVICE_VERSION=1.0.0
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - FLASK_PORT=5006
      - USE_DOCKER=true
    networks:
      - ld-observability
    restart: unless-stopped

  # Analytics Service (leaf service - no dependencies)
  analytics-service:
    build:
      context: ./backend
      dockerfile: services/analytics-service/Dockerfile
    ports:
      - "5007:5007"
    environment:
      - LD_SDK_KEY=${LD_SDK_KEY}
      - SERVICE_NAME=analytics-service
      - SERVICE_VERSION=1.0.0
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - FLASK_PORT=5007
      - USE_DOCKER=true
    networks:
      - ld-observability
    restart: unless-stopped

  # Search Service
  search-service:
    build:
      context: ./backend
      dockerfile: services/search-service/Dockerfile
    ports:
      - "5008:5008"
    environment:
      - LD_SDK_KEY=${LD_SDK_KEY}
      - SERVICE_NAME=search-service
      - SERVICE_VERSION=1.0.0
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - FLASK_PORT=5008
      - USE_DOCKER=true
    depends_on:
      - inventory-service
    networks:
      - ld-observability
    restart: unless-stopped

  # Chat Service (AI support chatbot via Ollama + LD AI Configs)
  chat-service:
    build:
      context: ./backend
      dockerfile: services/chat-service/Dockerfile
    ports:
      - "5009:5009"
    environment:
      - LD_SDK_KEY=${LD_SDK_KEY}
      - SERVICE_NAME=chat-service
      - SERVICE_VERSION=1.0.0
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - FLASK_PORT=5009
      - USE_DOCKER=true
      - OLLAMA_URL=${OLLAMA_URL:-http://ollama:11434}
    networks:
      - ld-observability
    restart: unless-stopped

  # Ollama - Local LLM server (only with --profile local-models)
  # For team deployments, set OLLAMA_URL in .env to point at a shared central server instead
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=-1
    networks:
      - ld-observability
    restart: unless-stopped
    profiles:
      - local-models
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # One-shot init container: pull models + warm them up so first requests are fast
  ollama-pull:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Pulling gemma3:1b..."
        OLLAMA_HOST=http://ollama:11434 ollama pull gemma3:1b
        echo "Pulling deepseek-r1:1.5b..."
        OLLAMA_HOST=http://ollama:11434 ollama pull deepseek-r1:1.5b
        echo "All models pulled. Warming up..."
        OLLAMA_HOST=http://ollama:11434 ollama run gemma3:1b "hi" --nowordwrap
        echo "gemma3:1b warm."
        OLLAMA_HOST=http://ollama:11434 ollama run deepseek-r1:1.5b "hi" --nowordwrap
        echo "deepseek-r1:1.5b warm."
        echo "All models ready."
    networks:
      - ld-observability
    profiles:
      - local-models

  # Frontend
  frontend:
    build:
      context: ./frontend
      args:
        - VITE_LD_CLIENT_SIDE_ID=${VITE_LD_CLIENT_SIDE_ID}
        # Use empty string so frontend uses relative URLs (/api/...) which nginx proxies
        - VITE_API_URL=
    ports:
      - "3000:80"
    depends_on:
      - api-gateway
    networks:
      - ld-observability
    restart: unless-stopped

  # Traffic Simulator (Browser-based with Playwright)
  # Human-like sessions: ~60 seconds each, with typing, hesitation, and full endpoint coverage
  simulator:
    build:
      context: .
      dockerfile: simulator/Dockerfile
    environment:
      - FRONTEND_URL=http://frontend:80
      - SESSIONS_PER_MINUTE=${SESSIONS_PER_MINUTE:-2}
      - MAX_CONCURRENT_BROWSERS=${MAX_CONCURRENT_BROWSERS:-3}
      - TARGET_SESSION_DURATION=${TARGET_SESSION_DURATION:-60}
      - SESSION_TIMEOUT=${SESSION_TIMEOUT:-90}
    volumes:
      - ./simulator/logs:/app/logs
    depends_on:
      - frontend
      - api-gateway
    networks:
      - ld-observability
    restart: unless-stopped
    # Playwright needs more resources
    deploy:
      resources:
        limits:
          memory: 2G

volumes:
  ollama_data:

networks:
  ld-observability:
    driver: bridge
